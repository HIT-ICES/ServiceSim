serviceProvider: # 暂时先不支持多个service provider吧，我们的重点是观察服务提供商的策略
  type: ServiceProvider # 这里的type是预留，后面仿真的监控指标变多，可能会存在NetworkDeviceWithMonitor
  name: "serviceProvider"
  serviceChains:
#    type: JavaFunction
#    path: ""
#    parms:
#      microservices: [0, 1, 2, 3]
#      cloudletLength: [0, 0.4, 0.4, 0.4]
#      pesNumber: [1, 1, 1, 1]
#      memory: [1, 1, 1, 1]
#      a: 0.2
#      data: 1000
#      scList:
#        - id: 0
#          serviceRelationship:
#            - svcId: 0
#              followSvcs: [1]
#            - svcId: 1
#              followSvcs: [2,3]
#        - id: 1
#          serviceRelationship:
#            - svcId: 0
#              followSvcs: [4]
#            - svcId: 4
#              followSvcs: [3]
#            - svcId: 3
#              followSvcs: [5]

    type: PureLoad
    scList:
      - id: 0
        microservices: [0, 1, 2, 3]
        cloudletLength: [0, 0.4, 0.4, 0.4]
        pesNumber: [1, 1, 1, 1]
        memory: [10, 100, 100, 100]
        serviceStages:
          - serviceId: 0 # 每个服务+前置服务确定一个服务对应任务的stages
            previousScId: -1
            stages:
              - type: WAIT_SEND
                stageOrder: 0
                peer: 1
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 0
                peer: 1
                stageCloudletLength: 0
                data: 1000
          - serviceId: 1
            previousScId: 0
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 1
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 2
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_SEND
                stageOrder: 2
                peer: 3
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 3
                peer: 2
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 4
                peer: 3
                stageCloudletLength: 0
                data: 1000
              - type: EXECUTION
                stageOrder: 5
                peer: 1
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 6
                peer: 0
                stageCloudletLength: 0
                data: 1000
          - serviceId: 2
            previousScId: 1
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 2
                stageCloudletLength: 0.4
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 1
                stageCloudletLength: 0
                data: 1000
          - serviceId: 3
            previousScId: 1
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 3
                stageCloudletLength: 0.4
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 1
                stageCloudletLength: 0
                data: 1000
      - id: 1
        microservices: [0, 4, 3, 5]
        cloudletLength: [0, 0.4, 0.4, 0.4]
        pesNumber: [1, 1, 1, 1]
        memory: [10, 100, 100, 100]
        serviceStages:
          - serviceId: 0
            previousScId: -1
            stages:
              - type: WAIT_SEND
                stageOrder: 0
                peer: 4
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 1
                peer: 4
                stageCloudletLength: 0
                data: 1000
          - serviceId: 4
            previousScId: 0
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 4
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 3
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 2
                peer: 3
                stageCloudletLength: 0
                data: 1000
              - type: EXECUTION
                stageOrder: 3
                peer: 4
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 4
                peer: 0
                stageCloudletLength: 0
                data: 1000
          - serviceId: 3
            previousScId: 4
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 3
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 5
                stageCloudletLength: 0
                data: 1000
              - type: WAIT_RECV
                stageOrder: 2
                peer: 5
                stageCloudletLength: 0
                data: 1000
              - type: EXECUTION
                stageOrder: 3
                peer: 3
                stageCloudletLength: 0.2
                data: 0
              - type: WAIT_SEND
                stageOrder: 4
                peer: 4
                stageCloudletLength: 0
                data: 1000
          - serviceId: 5
            previousScId: 3
            stages:
              - type: EXECUTION
                stageOrder: 0
                peer: 5
                stageCloudletLength: 0.4
                data: 0
              - type: WAIT_SEND
                stageOrder: 1
                peer: 3
                stageCloudletLength: 0
                data: 1000

  loadAdmission:
    - type: NonLoadAdmission #JavaLoad lua
      path: "org.serviceProvider.capacities.NonLoadAdmission"
      targetDevices: ["Datacenter_0", "Datacenter_1", "Datacenter_2", "Datacenter_3"]

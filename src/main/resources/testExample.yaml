  channels:
    - source: "Datacenter_0" # 这里面每两个datacenter之间都需要有两个channel，分别代表不同的机器上传数据包的带宽和延时
      target: "Datacenter_1"
      bandwidth: 104857600 # 100 * 1024 * 1024
      latency: 0.15
      packetScheduler:
        type: PacketSchedulerTimeShared # 可以lua
        path: "org.infrastructureProvider.policies.PacketSchedulerTimeShared"

    - source: "Datacenter_1"
      target: "Datacenter_0"
      bandwidth: 104857600 # 100 * 1024 * 1024
      latency: 0.15
      packetScheduler:
        type: PacketSchedulerTimeShared # 可以lua
        path: "org.infrastructureProvider.policies.PacketSchedulerTimeShared"

    - source: "Datacenter_1"
      target: "Datacenter_2"
      bandwidth: 104857600 # 100 * 1024 * 1024
      latency: 0.002
      scheduler: "TimeShared"
      packetScheduler:
        type: PacketSchedulerTimeShared # 可以lua
        path: "org.infrastructureProvider.policies.PacketSchedulerTimeShared"

    - source: "Datacenter_2"
      target: "Datacenter_1"
      bandwidth: 104857600 # 100 * 1024 * 1024
      latency: 0.002

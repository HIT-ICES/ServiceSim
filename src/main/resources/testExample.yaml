  requestDispatching:
    - device: "Datacenter_0"
      type: RequestDispatchingSimple
      path: "org.serviceProvider.capacities.RequestDispatchingSimple"
      dispatchRange: ["Datacenter_0", "Datacenter_1"]
    - device: "Datacenter_1"
      type: RequestDispatchingSimple
      path: "org.serviceProvider.capacities.RequestDispatchingSimple"
      dispatchRange: ["Datacenter_1"]
    - device: "Datacenter_2"
      type: RequestDispatchingSimple

                            parms:
                              mips: 40
                        - id: 5 # id从0开始
                          peProvisioner:
                            type: PeProvisionerSimple # 可以JavaLoad,可以LuaBuild
                            path: "org.infrastructureProvider.policies.provisioners.PeProvisionerSimple"
                            parms:
                              mips: 40
                        - id: 6 # id从0开始
                          peProvisioner:
                            type: JavaLoad # 可以JavaLoad,可以LuaBuild
                            path: "org.infrastructureProvider.policies.provisioners.PeProvisionerSimple"
                            parms:
                              mips: 40
                        - id: 7 # id从0开始
                          peProvisioner:
                            type: JavaLoad # 可以JavaLoad,可以LuaBuild

  loadBalance:
    - type: RoundRobin # JavaLoad lua
      path: "org.serviceProvider.capacities.RoundRobin"
      targetDevices: ["Datacenter_0", "Datacenter_1", "Datacenter_2", "Datacenter_3"]
  #    - device: "Datacenter_0"
  #      type: RoundRobin
  #      path: "org.serviceProvider.capacities.RoundRobin"
